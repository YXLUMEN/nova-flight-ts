name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 不把 token 持久化到 .git/config, 避免依赖的安装脚本读到
          persist-credentials: false

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建前端
        run: npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  rust:
    name: Rust 编译检查(${{ matrix.os }})
    strategy:
      # 两个平台都查: 避免出现只在 Windows 能编译的平台相关代码
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2 \
            file

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 准备 Rust
        # 固定到 commit + 固定工具链版本
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 分支(2026-09-03)
        with:
          toolchain: '1.98.0'
          components: rustfmt

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci-${{ matrix.os }}

      - name: 安装依赖
        run: npm ci

      # tauri-build 会读取 tauri.conf.json 中的 frontendDist(../dist), 先产出前端以避免校验失败
      - name: 构建前端
        run: npm run build

      - name: cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      # 非阻塞: 便于渐进式统一代码风格, 习惯后可去掉 continue-on-error
      - name: cargo fmt 检查(非阻塞)
        continue-on-error: true
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
