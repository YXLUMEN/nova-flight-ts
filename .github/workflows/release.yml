name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 0.2.17); 留空则读取 src-tauri/tauri.conf.json'
        required: false
        type: string
      bump_and_tag:
        description: '自动改写版本号并提交 + 打 tag + 推送(仅手动触发可用)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '标记为预发布'
        required: false
        default: false
        type: boolean

# 创建 Release / 推送 tag 需要写权限
permissions:
  contents: write

# 同一 tag 只允许串行发布, 避免并发互相覆盖 latest.json
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  UPDATE_URL_TEMPLATE: ${{ vars.UPDATE_URL_TEMPLATE || 'https://arctic-red-tide.xyz/app/nova-flight/{name}' }}

jobs:
  prepare:
    name: 解析版本号与更新说明
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 需要完整 tag 历史来生成更新说明
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 确定目标版本 / 按需提交版本号并打 tag
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          BUMP_AND_TAG: ${{ inputs.bump_and_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # 1) 目标版本: tag 推送取 tag 名, 手动触发取输入值或配置文件当前值
          current="$(node .github/scripts/get-version.mjs)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            target="${INPUT_VERSION:-$current}"
          else
            target="${REF_NAME#v}"
          fi
          if ! node -e "process.exit(/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1]) ? 0 : 1)" "$target"; then
            echo "::error::版本号 '$target' 不是合法的 x.y.z 形式"
            exit 1
          fi
          tag="v$target"
          echo "当前版本: $current; 目标版本: $target (tag: $tag)"

          if [ "$BUMP_AND_TAG" = "true" ]; then
            # 2a) 自动改版本号: 仅改写 tauri.conf.json(版本号唯一来源), 提交并推送
            node .github/scripts/set-version.mjs "$target"

            if git diff --quiet; then
              echo "版本号无变化, 跳过提交"
            else
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -am "chore: 发布 $tag"
              git push origin "HEAD:${REF_NAME}"
            fi

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag 已存在, 请换一个版本号"
              exit 1
            fi
            git tag -a "$tag" -m "release $tag"
            git push origin "$tag"
            checkout_ref="$tag"
          else
            # 2b) 不自动改版本号: 版本号必须与源码一致, 否则拒绝发布
            node .github/scripts/get-version.mjs --verify "$target"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              checkout_ref="$tag"
            else
              # 手动触发且尚未打过 tag 时, 在当前提交上补建 tag
              echo "tag $tag 不存在, 将在当前提交上创建"
              git tag -a "$tag" -m "release $tag"
              git push origin "$tag"
              checkout_ref="$tag"
            fi
          fi

          # 3) 更新说明: 上一个版本 tag 到本版本之间的提交标题
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${checkout_ref}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="${previous}..${checkout_ref}"
            echo "更新说明范围: $range"
          else
            range="${checkout_ref}"
            echo "未找到历史 tag, 仅输出最近 20 条提交"
          fi

          {
            echo "## Nova Flight $tag"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --invert-grep --grep='^chore: 发布 v' --pretty=format:'- %s' "$range"
            else
              git log --no-merges --invert-grep --grep='^chore: 发布 v' -20 --pretty=format:'- %s' "$checkout_ref"
            fi
            echo
          } > release-notes.md

          echo "version=$target" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: 上传更新说明
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

      # 先建草稿: 各平台并行上传资源时不会露出半成品, 全部完成后由 manifest 任务转为正式发布
      - name: 预创建草稿 Release
        shell: bash
        env:
          # 只有这一步需要 gh; git push 用的是 checkout 持久化的凭据
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在, 跳过创建"
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "Nova Flight $VERSION" \
              --notes-file release-notes.md
            echo "已创建草稿 Release $TAG, 全部平台构建完成后自动转为正式发布"
          fi

  build:
    name: 构建 ${{ matrix.platform }}
    needs: prepare
    strategy:
      # 一个平台失败不影响其他平台继续构建, 便于一次性看到所有问题
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            # updater 产物(用于 latest.json 的 url 与 signature)
            updater_glob: 'src-tauri/target/release/bundle/msi/*.msi'
            # 其余需要一并上传到 Release 的文件; 签名文件由 <updater_glob>.sig 自动带上, 无需重复列
            extra_glob: ''
          - os: ubuntu-22.04
            platform: linux-x86_64
            # 必须用 ubuntu-22.04: 24.04 产出的二进制要求更新的 glibc, 用户侧可能跑不起来
            # v2 的 updater 产物就是 AppImage 本身(只有 v1 兼容模式才会额外打 .AppImage.tar.gz)
            updater_glob: 'src-tauri/target/release/bundle/appimage/*.AppImage'
            extra_glob: 'src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/deb/*.deb.sig'
    runs-on: ${{ matrix.os }}
    # 不放密钥: job 级 env 对每一步可见, 包含执行第三方安装脚本的 npm ci
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 准备 Rust
        # 固定到 commit + 固定工具链版本
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 分支(2026-09-03)
        with:
          toolchain: '1.98.0'

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo.toml 位于 src-tauri, target 目录也随之外移
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}
          # LTO + codegen-units=1 构建较慢, 失败时也保留缓存
          cache-on-failure: true

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2 \
            file

      - name: 安装依赖
        run: npm ci

      # 该命令内部会依次执行 beforeBuildCommand(npm run build) 与 tauri build
      # 包类型: Windows 取 tauri.conf.json 的 targets, Linux 由 tauri.linux.conf.json 覆盖
      # 签名私钥只在这一步注入
      - name: 构建安装包与 updater 签名
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::未配置 TAURI_SIGNING_PRIVATE_KEY; updater 产物无法签名, 请在仓库 Secrets 中添加"
            exit 1
          fi
          npm run tauri build

      - name: 生成单平台更新清单
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          updater_files=(${{ matrix.updater_glob }})
          if [ "${#updater_files[@]}" -ne 1 ]; then
            echo "::error::期望 1 个 updater 产物, 实际得到 ${#updater_files[@]} 个"
            echo "::error::glob = ${{ matrix.updater_glob }}"
            # 只列各构建目录的第一层: 递归会把 .AppDir 整棵树刷出来, 把报错行顶出日志可见范围
            for dir in src-tauri/target/release/bundle/*/; do
              echo "--- $dir"
              ls -lh "$dir" || true
            done
            exit 1
          fi
          updater_file="${updater_files[0]}"
          if [ ! -f "$updater_file.sig" ]; then
            echo "::error::缺少签名文件 $updater_file.sig; 确认 tauri.conf.json 的 createUpdaterArtifacts 为 true"
            exit 1
          fi

          # url 指向更新服务器, 与 tauri.conf.json 中 updater.endpoints 所在位置保持一致
          url_template="${UPDATE_URL_TEMPLATE}"
          url="${url_template//\{name\}/$(basename "$updater_file")}"
          url="${url//\{version\}/$VERSION}"
          url="${url//\{target\}/${{ matrix.platform }}}"

          mkdir -p manifest
          node .github/scripts/gen-latest-json.mjs \
            --version "$VERSION" \
            --out "manifest/${{ matrix.platform }}.json" \
            --target "${{ matrix.platform }}" \
            --signature-file "$updater_file.sig" \
            --url "$url"
          cat "manifest/${{ matrix.platform }}.json"

      - name: 上传产物到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(${{ matrix.updater_glob }} ${{ matrix.updater_glob }}.sig ${{ matrix.extra_glob }})
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::没有找到可上传的产物"
            exit 1
          fi
          # 去重, 避免同一文件重复上传
          unique=()
          for asset in "${assets[@]}"; do
            duplicate=false
            for exist in "${unique[@]:-}"; do
              if [ "$exist" = "$asset" ]; then duplicate=true; fi
            done
            if [ "$duplicate" = "false" ]; then unique+=("$asset"); fi
          done
          printf '上传: %s\n' "${unique[@]}"
          gh release upload "$TAG" "${unique[@]}" --clobber

      - name: 上传清单片段
        uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ matrix.platform }}
          path: manifest/${{ matrix.platform }}.json
          retention-days: 1

  manifest:
    name: 合并更新清单并发布
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载各平台清单片段
        uses: actions/download-artifact@v8
        with:
          pattern: manifest-*
          path: manifests
          merge-multiple: true

      - name: 下载更新说明
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      # 所有平台构建完成后统一合并: updater 会先完整校验整份清单, 各平台各自写一份会互相覆盖
      - name: 合并为 latest.json
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          fragments=(manifests/*.json)
          if [ "${#fragments[@]}" -eq 0 ]; then
            echo "::error::没有下载到任何清单片段"
            exit 1
          fi
          node .github/scripts/merge-latest-json.mjs \
            --version "$VERSION" \
            --notes-file release-notes.md \
            --out latest.json \
            "${fragments[@]}"
          cat latest.json

      - name: 上传清单并转为正式发布
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" latest.json --clobber

          args=(--title "Nova Flight $VERSION" --notes-file release-notes.md --draft=false)
          if [ "${PRERELEASE:-false}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release edit "$TAG" "${args[@]}"

  publish-cdn:
    name: 同步到自建站点
    needs: [ prepare, manifest ]
    if: ${{ vars.CDN_HOST != '' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      CDN_HOST: ${{ vars.CDN_HOST }}
      CDN_USER: ${{ vars.CDN_USER }}
      CDN_PATH: ${{ vars.CDN_PATH }}
    steps:
      - name: 校验部署配置
        env:
          CDN_SSH_KEY: ${{ secrets.CDN_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CDN_SSH_KEY:-}" ]; then
            echo "::warning::未配置 CDN_SSH_KEY, 跳过自建站点发布(产物已在 GitHub Release 中)"
            exit 0
          fi
          for name in CDN_HOST CDN_USER CDN_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少配置 $name"
              exit 1
            fi
          done
          echo "deploy_target=${CDN_USER}@${CDN_HOST}:${CDN_PATH}" >> "$GITHUB_ENV"

      - name: 下载 Release 产物
        if: ${{ env.deploy_target != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          # 发布阶段所有平台的产物与 latest.json 都已就位, 整体拉取即可
          gh release download "$TAG" --repo "${{ github.repository }}" --dir dist-assets --clobber --pattern '*'
          ls -l dist-assets

      - name: 安装 rsync
        if: ${{ env.deploy_target != '' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync

      - name: 通过 rsync 发布
        if: ${{ env.deploy_target != '' }}
        env:
          CDN_SSH_KEY: ${{ secrets.CDN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CDN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CDN_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 不删除远端历史版本: 旧安装包仍被老版本客户端的 latest.json 引用
          rsync -avz --chmod=F644 \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            dist-assets/ "${CDN_USER}@${CDN_HOST}:${CDN_PATH}"
