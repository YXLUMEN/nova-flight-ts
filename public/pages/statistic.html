<section class="c-section statistic hidden" id="statistic">
    <link rel="stylesheet" href="/css/statistic.css"/>

    <span class="c-element grid"></span>

    <div class="title" data-i18n="statistic.title"></div>

    <div class="container">
        <div class="directory" id="statistic-directory">
            <div class="item" data-name="historical-score" data-i18n="statistic.score"></div>
        </div>

        <div class="c-section statistic-displayer hidden" id="statistic-displayer"></div>
    </div>

    <div class="control-buttons">
        <button class="c-button confirm-btn" id="statistic-back" data-i18n="statistic.back"></button>
    </div>
</section>
