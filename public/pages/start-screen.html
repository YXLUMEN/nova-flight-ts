<section class="c-section start-screen hidden" id="start-screen">
    <link rel="stylesheet" href="/css/start-screen.css">

    <div class="start-menu">
        <div class="title">Nova Flight</div>
        <div class="subtitle" data-i18n="start.subtitle"></div>

        <div class="start-actions">
            <button type="button" class="c-button" data-action="start" data-i18n="start.start"></button>
            <button type="button" class="c-button" data-action="multiplayer" data-i18n="start.multiplayer"></button>
            <button type="button" class="c-button" data-action="statistic" data-i18n="start.statistic"></button>
            <button type="button" class="c-button danger" data-action="exit" data-i18n="start.exit"></button>
        </div>
    </div>
</section>
