<section class="c-section pause-overlay hidden" id="pause-screen">
    <link rel="stylesheet" href="/css/pause-overlay.css">

    <div class="pause-menu">
        <div class="pause-title"></div>
        <div class="pause-hint"></div>

        <button type="button" class="c-button primary" data-action="back"></button>
<!--        <button type="button" class="c-button" data-action="settings"></button>-->
        <button type="button" class="c-button" data-action="save"></button>
        <button type="button" class="c-button danger" data-action="save-and-exit"></button>
    </div>

    <div class="pause-tips">
        <div class="pause-tips-title"></div>
        <div class="pause-tips-body"></div>
    </div>
</section>
